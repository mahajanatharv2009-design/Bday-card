<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="pageTitle">Happy Birthday!</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100svh;
      font-family: Georgia, "Times New Roman", serif;
      background: radial-gradient(circle at top, #fff7d6, #ffb6d5 45%, #9b5de5 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: clamp(12px, 4vw, 25px);
      overflow-x: hidden;
    }

    .confetti {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .confetti span {
      position: absolute;
      top: -20px;
      width: 10px;
      height: 18px;
      border-radius: 3px;
      animation: fall 5s linear infinite;
    }

    .confetti span:nth-child(1) { left: 8%; background: #ff4d6d; animation-delay: 0s; }
    .confetti span:nth-child(2) { left: 18%; background: #ffd60a; animation-delay: 1s; }
    .confetti span:nth-child(3) { left: 30%; background: #4cc9f0; animation-delay: 2s; }
    .confetti span:nth-child(4) { left: 44%; background: #80ed99; animation-delay: 0.5s; }
    .confetti span:nth-child(5) { left: 58%; background: #f72585; animation-delay: 1.5s; }
    .confetti span:nth-child(6) { left: 70%; background: #7209b7; animation-delay: 2.5s; }
    .confetti span:nth-child(7) { left: 82%; background: #ff9f1c; animation-delay: 3s; }
    .confetti span:nth-child(8) { left: 93%; background: #06d6a0; animation-delay: 1.2s; }

    .scene {
      width: 100%;
      display: flex;
      justify-content: center;
      perspective: 1400px;
      z-index: 2;
    }

    .birthday-card {
      width: min(92vw, 720px);
      height: clamp(360px, 61vw, 470px);
      position: relative;
      transform-style: preserve-3d;
      animation: cardArrive 1.2s ease forwards;
    }

    .inside {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #fffdf7, #fff0f6);
      border-radius: 18px;
      box-shadow: 0 30px 70px rgba(60, 20, 90, 0.35);
      border: 3px solid #fff;
      display: grid;
      grid-template-columns: 1fr 1fr;
      overflow: hidden;
    }

    .left-page,
    .right-page {
      padding: clamp(10px, 4vw, 35px);
      position: relative;
    }

    .left-page {
      background: linear-gradient(160deg, #fff7cc, #ffe3ed);
      border-right: 2px dashed #f7a8c5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .right-page {
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
    }

    .front-cover {
      position: absolute;
      cursor: pointer;
      inset: 0 0 0 50%;
      transform-origin: left center;
      background: linear-gradient(135deg, #ff4d88, #ff8fab, #ffd166);
      border-radius: 0 18px 18px 0;
      box-shadow: 0 25px 55px rgba(130, 25, 75, 0.35);
      z-index: 5;
      transition: transform 1.4s ease;
      transform-style: preserve-3d;
      border: 3px solid rgba(255,255,255,0.75);
    }

    .cover-content,
    .cover-back {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
    }

    .cover-content {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
      padding: clamp(10px, 3vw, 25px);
    }

    .cover-content h2 {
      font-size: clamp(1.4rem, 5vw, 2.6rem);
      text-shadow: 2px 3px 0 rgba(0,0,0,0.12);
      line-height: 1.1;
    }

    .cover-content p {
      margin-top: 18px;
      font-family: Arial, sans-serif;
      font-weight: bold;
      letter-spacing: clamp(1px, 0.4vw, 2px);
      font-size: clamp(0.55rem, 2.2vw, 0.9rem);
    }

    .cover-back {
      transform: rotateY(180deg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
      padding: 25px;
      background: linear-gradient(135deg, #ff8fab, #ff4d88, #9b5de5);
      border-radius: 18px 0 0 18px;
    }

    .cover-back h2 {
      font-size: 2.4rem;
      line-height: 1.15;
      text-shadow: 2px 3px 0 rgba(0,0,0,0.12);
    }

    .cover-back p {
      margin-top: 18px;
      font-family: Arial, sans-serif;
      font-weight: bold;
      letter-spacing: 1.5px;
      font-size: 0.9rem;
      text-transform: uppercase;
    }

    .seal {
      margin-top: 25px;
      width: clamp(48px, 12vw, 80px);
      height: clamp(48px, 12vw, 80px);
      border-radius: 50%;
      background: white;
      color: #ff4d88;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.4rem, 4.5vw, 2.2rem);
      box-shadow: inset 0 0 0 5px #ffe3ec, 0 8px 20px rgba(0,0,0,0.18);
      animation: pulse 1.8s infinite;
    }

    h1 {
      color: #d6336c;
      font-size: clamp(1.25rem, 5.5vw, 2.65rem);
      line-height: 1.1;
      margin-bottom: clamp(8px, 2.4vw, 18px);
    }

    .cake-wrap {
      position: relative;
      width: clamp(90px, 28vw, 210px);
      height: clamp(90px, 28vw, 210px);
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 12px;
    }

    .cake-glow {
      position: absolute;
      width: clamp(82px, 25vw, 195px);
      height: clamp(82px, 25vw, 195px);
      border-radius: 50%;
      background: radial-gradient(circle, #fff3b0, #ffb3c6, transparent 70%);
      animation: glow 1.5s infinite alternate;
    }

    .cake-wrap img {
      width: clamp(70px, 21vw, 165px);
      z-index: 2;
      animation: cakeBounce 2s infinite ease-in-out;
      filter: drop-shadow(0 12px 12px rgba(0,0,0,0.25));
    }

    .message-title {
      font-family: Arial, sans-serif;
      color: #9d174d;
      font-weight: 800;
      font-size: clamp(0.65rem, 2.3vw, 1.15rem);
      margin-bottom: clamp(7px, 2vw, 15px);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .message {
      color: #4a2534;
      font-size: clamp(0.62rem, 2.25vw, 1.15rem);
      line-height: 1.35;
      background: #fff6fa;
      padding: clamp(8px, 2.6vw, 22px);
      border-radius: 18px;
      border: 2px solid #ffc2d1;
      box-shadow: inset 0 0 18px rgba(255, 170, 200, 0.25);
    }

    .signature {
      margin-top: 22px;
      color: #d6336c;
      font-size: 1.3rem;
      font-weight: bold;
    }

    .atharv-btn {
      position: fixed;
      left: 20px;
      bottom: 20px;
      z-index: 10;
      display: inline-block;
      font-family: Arial, sans-serif;
      text-decoration: none;
      background: linear-gradient(90deg, #d6336c, #ff7b00);
      color: white;
      padding: 13px 22px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: bold;
      box-shadow: 0 12px 25px rgba(214, 51, 108, 0.35);
      transition: 0.3s;
    }

    .atharv-btn:hover {
      transform: translateY(-4px) scale(1.04);
      box-shadow: 0 18px 35px rgba(214, 51, 108, 0.45);
    }

    .stars {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .stars span {
      position: absolute;
      animation: twinkle 1.3s infinite alternate;
      font-size: clamp(0.8rem, 3vw, 1.4rem);
    }

    .stars span:nth-child(1) { top: 25px; left: 25px; }
    .stars span:nth-child(2) { top: 70px; right: 30px; animation-delay: .3s; }
    .stars span:nth-child(3) { bottom: 40px; left: 45px; animation-delay: .6s; }
    .stars span:nth-child(4) { bottom: 25px; right: 35px; animation-delay: .9s; }

    .balloon {
      position: fixed;
      bottom: -130px;
      width: 54px;
      height: 72px;
      border-radius: 50%;
      z-index: 1;
      animation: floatBalloon 9s linear infinite;
    }

    .balloon::after {
      content: "";
      position: absolute;
      top: 72px;
      left: 26px;
      width: 2px;
      height: 70px;
      background: rgba(255,255,255,0.8);
    }

    .b1 { left: 6%; background: #ff4d6d; animation-delay: 0s; }
    .b2 { left: 88%; background: #4cc9f0; animation-delay: 2s; }
    .b3 { left: 15%; background: #ffd60a; animation-delay: 4s; }
    .b4 { left: 78%; background: #b5179e; animation-delay: 6s; }

    .birthday-card.open .front-cover {
      transform: rotateY(165deg);
    }

    @keyframes cardArrive {
      from { opacity: 0; transform: scale(0.75) rotate(-4deg); }
      to { opacity: 1; transform: scale(1) rotate(0); }
    }

    @keyframes cakeBounce {
      0%, 100% { transform: translateY(0) rotate(-1deg); }
      50% { transform: translateY(-14px) rotate(1deg); }
    }

    @keyframes glow {
      from { transform: scale(0.9); opacity: .6; }
      to { transform: scale(1.08); opacity: 1; }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    @keyframes twinkle {
      from { opacity: .35; transform: scale(.7) rotate(0deg); }
      to { opacity: 1; transform: scale(1.25) rotate(20deg); }
    }

    @keyframes fall {
      0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
    }

    @keyframes floatBalloon {
      0% { transform: translateY(0) rotate(-4deg); opacity: 0; }
      15% { opacity: 1; }
      100% { transform: translateY(-120vh) rotate(8deg); opacity: 0; }
    }

    @media (max-width: 750px) {
      body {
        align-items: center;
        padding: 14px 10px 80px;
        overflow-y: auto;
      }

      .birthday-card {
        width: min(94vw, 720px);
        height: clamp(340px, 72vw, 440px);
      }

      .inside {
        position: absolute;
        inset: 0;
        grid-template-columns: 1fr 1fr;
      }

      .left-page,
      .right-page {
        padding: clamp(8px, 2.8vw, 18px);
      }

      .left-page {
        border-right: 2px dashed #f7a8c5;
        border-bottom: none;
      }

      .front-cover {
        display: block;
        inset: 0 0 0 50%;
      }

      .message {
        line-height: 1.3;
      }

      .atharv-btn {
        left: 50%;
        bottom: 12px;
        transform: translateX(-50%);
        white-space: nowrap;
        font-size: clamp(0.68rem, 2.7vw, 0.85rem);
        padding: 10px 16px;
      }

      .atharv-btn:hover {
        transform: translateX(-50%) scale(1.04);
      }
    }

    @media (max-width: 380px) {
      .birthday-card {
        height: 335px;
      }

      .left-page,
      .right-page {
        padding: 8px;
      }

      .message {
        font-size: 0.58rem;
        padding: 7px;
      }

      .message-title {
        font-size: 0.62rem;
      }

      .cover-content p {
        font-size: 0.52rem;
      }
    }
  </style>
</head>

<body>
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      // Change the name here only, and it updates the whole card
      const birthdayName = "Izzy";

      document.querySelectorAll(".person-name").forEach(nameSpot => {
        nameSpot.textContent = birthdayName;
      });

      document.title = "Happy Birthday " + birthdayName + "!";

      const card = document.getElementById("birthdayCard");
      const scene = document.getElementById("scene");

      let isOpen = false;
      let isMusicPlaying = false;

      function playTone(audioCtx, frequency, startTime, duration) {
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();

        oscillator.type = "triangle";
        oscillator.frequency.setValueAtTime(frequency, startTime);

        gainNode.gain.setValueAtTime(0.0001, startTime);
        gainNode.gain.linearRampToValueAtTime(0.06, startTime + 0.03);
        gainNode.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        oscillator.start(startTime);
        oscillator.stop(startTime + duration);
      }

      function playBirthdayMusic() {
        if (isMusicPlaying) return;

        isMusicPlaying = true;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        const G4 = 392.00;
        const A4 = 440.00;
        const B4 = 493.88;
        const C5 = 523.25;
        const D5 = 587.33;
        const E5 = 659.25;

        const melody = [
          [G4, 0.35], [G4, 0.35], [A4, 0.7], [G4, 0.7], [C5, 0.7], [B4, 1.1],
          [G4, 0.35], [G4, 0.35], [A4, 0.7], [G4, 0.7], [D5, 0.7], [C5, 1.1],
          [G4, 0.35], [G4, 0.35], [E5, 0.7], [C5, 0.7], [B4, 0.7], [A4, 1.1],
          [E5, 0.35], [E5, 0.35], [C5, 0.7], [D5, 0.7], [C5, 1.4]
        ];

        let time = audioCtx.currentTime + 0.1;

        melody.forEach(([note, duration]) => {
          playTone(audioCtx, note, time, duration);
          time += duration + 0.08;
        });

        setTimeout(() => {
          audioCtx.close();
          isMusicPlaying = false;
        }, (time - audioCtx.currentTime + 0.5) * 1000);
      }

      scene.addEventListener("click", (event) => {
        if (event.target.closest("a")) return;

        isOpen = !isOpen;

        if (isOpen) {
          card.classList.add("open");
          playBirthdayMusic();
        } else {
          card.classList.remove("open");
        }
      });
    });
  </script>

  <div class="confetti">
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
  </div>

  <div class="balloon b1"></div>
  <div class="balloon b2"></div>
  <div class="balloon b3"></div>
  <div class="balloon b4"></div>

  <div class="scene" id="scene">
    <div class="birthday-card" id="birthdayCard">
      <div class="inside">
        <section class="left-page">
          <div class="stars">
            <span>✨</span><span>🌟</span><span>💫</span><span>✨</span>
          </div>

          <h1>Happy Birthday<br><span class="person-name">Jessica</span>!</h1>

          <div class="cake-wrap">
            <div class="cake-glow"></div>
            <img src="cake.png" alt="Birthday Cake">
          </div>
        </section>

        <section class="right-page">
          <p class="message-title">A little birthday wish</p>

          <div class="message">
            Happy Birthday, <span class="person-name">Jessica</span>! Hope your day is full
            of smiles, cake, and good memories.<br>
            Wishing you happiness, success, and an amazing year ahead.
          </div>
        </section>
      </div>

      <div class="front-cover">
        <div class="cover-content">
          <div class="seal">🎁</div>
          <p>Click to read message</p>
        </div>
      </div>
    </div>
  </div>

     class="atharv-btn"
     target="_blank">
     See More of Atharv’s Work →
  </a>
</body>
</html>

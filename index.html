<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="pageTitle">Happy Birthday!</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      background: radial-gradient(circle at top, #fff7d6, #ffb6d5 45%, #9b5de5 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
      overflow: hidden;
    }

    .confetti {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .confetti span {
      position: absolute;
      top: -20px;
      width: 10px;
      height: 18px;
      border-radius: 3px;
      animation: fall 5s linear infinite;
    }

    .confetti span:nth-child(1) { left: 8%; background: #ff4d6d; animation-delay: 0s; }
    .confetti span:nth-child(2) { left: 18%; background: #ffd60a; animation-delay: 1s; }
    .confetti span:nth-child(3) { left: 30%; background: #4cc9f0; animation-delay: 2s; }
    .confetti span:nth-child(4) { left: 44%; background: #80ed99; animation-delay: 0.5s; }
    .confetti span:nth-child(5) { left: 58%; background: #f72585; animation-delay: 1.5s; }
    .confetti span:nth-child(6) { left: 70%; background: #7209b7; animation-delay: 2.5s; }
    .confetti span:nth-child(7) { left: 82%; background: #ff9f1c; animation-delay: 3s; }
    .confetti span:nth-child(8) { left: 93%; background: #06d6a0; animation-delay: 1.2s; }

    .scene {
      perspective: 1400px;
      z-index: 2;
    }

    .birthday-card {
      width: 720px;
      max-width: 92vw;
      height: 470px;
      position: relative;
      transform-style: preserve-3d;
      animation: cardArrive 1.2s ease forwards;
    }

    .inside {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #fffdf7, #fff0f6);
      border-radius: 18px;
      box-shadow: 0 30px 70px rgba(60, 20, 90, 0.35);
      border: 3px solid #fff;
      display: grid;
      grid-template-columns: 1fr 1fr;
      overflow: hidden;
    }

    .left-page,
    .right-page {
      padding: 35px;
      position: relative;
    }

    .left-page {
      background: linear-gradient(160deg, #fff7cc, #ffe3ed);
      border-right: 2px dashed #f7a8c5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .right-page {
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
    }

    .front-cover {
      position: absolute;
      cursor: pointer;
      inset: 0 0 0 50%;
      transform-origin: left center;
      background: linear-gradient(135deg, #ff4d88, #ff8fab, #ffd166);
      border-radius: 0 18px 18px 0;
      box-shadow: 0 25px 55px rgba(130, 25, 75, 0.35);
      z-index: 5;
      transition: transform 1.4s ease;
      transform-style: preserve-3d;
      border: 3px solid rgba(255,255,255,0.75);
    }

    .cover-content,
    .cover-back {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
    }

    .cover-content {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
      padding: 25px;
      backface-visibility: hidden;
    }

    .cover-content h2 {
      font-size: 2.6rem;
      text-shadow: 2px 3px 0 rgba(0,0,0,0.12);
      line-height: 1.1;
    }

    .cover-back {
      transform: rotateY(180deg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
      padding: 25px;
      background: linear-gradient(135deg, #ff8fab, #ff4d88, #9b5de5);
      border-radius: 18px 0 0 18px;
    }

    .cover-back h2 {
      font-size: 2.4rem;
      line-height: 1.15;
      text-shadow: 2px 3px 0 rgba(0,0,0,0.12);
    }

    .cover-back p {
      margin-top: 18px;
      font-family: Arial, sans-serif;
      font-weight: bold;
      letter-spacing: 1.5px;
      font-size: 0.9rem;
      text-transform: uppercase;
    }

    .cover-content p {
      margin-top: 18px;
      font-family: Arial, sans-serif;
      font-weight: bold;
      letter-spacing: 2px;
      font-size: 0.9rem;
    }

    .seal {
      margin-top: 25px;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: white;
      color: #ff4d88;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      box-shadow: inset 0 0 0 5px #ffe3ec, 0 8px 20px rgba(0,0,0,0.18);
      animation: pulse 1.8s infinite;
    }

    h1 {
      color: #d6336c;
      font-size: 2.65rem;
      line-height: 1.1;
      margin-bottom: 18px;
    }

    .cake-wrap {
      position: relative;
      width: 210px;
      height: 210px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 12px;
    }

    .cake-glow {
      position: absolute;
      width: 195px;
      height: 195px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff3b0, #ffb3c6, transparent 70%);
      animation: glow 1.5s infinite alternate;
    }

    .cake-wrap img {
      width: 165px;
      z-index: 2;
      animation: cakeBounce 2s infinite ease-in-out;
      filter: drop-shadow(0 12px 12px rgba(0,0,0,0.25));
    }

    .message-title {
      font-family: Arial, sans-serif;
      color: #9d174d;
      font-weight: 800;
      font-size: 1.15rem;
      margin-bottom: 15px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .message {
      color: #4a2534;
      font-size: 1.15rem;
      line-height: 1.7;
      background: #fff6fa;
      padding: 22px;
      border-radius: 18px;
      border: 2px solid #ffc2d1;
      box-shadow: inset 0 0 18px rgba(255, 170, 200, 0.25);
    }

    .signature {
      margin-top: 22px;
      color: #d6336c;
      font-size: 1.3rem;
      font-weight: bold;
    }

    .atharv-btn {
      position: fixed;
      left: 20px;
      bottom: 20px;
      z-index: 10;
      display: inline-block;
      font-family: Arial, sans-serif;
      text-decoration: none;
      background: linear-gradient(90deg, #d6336c, #ff7b00);
      color: white;
      padding: 13px 22px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: bold;
      box-shadow: 0 12px 25px rgba(214, 51, 108, 0.35);
      transition: 0.3s;
    }

    .atharv-btn:hover {
      transform: translateY(-4px) scale(1.04);
      box-shadow: 0 18px 35px rgba(214, 51, 108, 0.45);
    }

    .stars {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .stars span {
      position: absolute;
      animation: twinkle 1.3s infinite alternate;
      font-size: 1.4rem;
    }

    .stars span:nth-child(1) { top: 25px; left: 25px; }
    .stars span:nth-child(2) { top: 70px; right: 30px; animation-delay: .3s; }
    .stars span:nth-child(3) { bottom: 40px; left: 45px; animation-delay: .6s; }
    .stars span:nth-child(4) { bottom: 25px; right: 35px; animation-delay: .9s; }

    .balloon {
      position: fixed;
      bottom: -130px;
      width: 54px;
      height: 72px;
      border-radius: 50%;
      z-index: 1;
      animation: floatBalloon 9s linear infinite;
    }

    .balloon::after {
      content: "";
      position: absolute;
      top: 72px;
      left: 26px;
      width: 2px;
      height: 70px;
      background: rgba(255,255,255,0.8);
    }

    .b1 { left: 6%; background: #ff4d6d; animation-delay: 0s; }
    .b2 { left: 88%; background: #4cc9f0; animation-delay: 2s; }
    .b3 { left: 15%; background: #ffd60a; animation-delay: 4s; }
    .b4 { left: 78%; background: #b5179e; animation-delay: 6s; }

    @keyframes openCard {
      0% { transform: rotateY(0deg); }
      100% { transform: rotateY(165deg); }
    }

    .birthday-card.open .front-cover {
      transform: rotateY(165deg);
    }

    @keyframes cardArrive {
      from { opacity: 0; transform: scale(0.75) rotate(-4deg); }
      to { opacity: 1; transform: scale(1) rotate(0); }
    }

    @keyframes cakeBounce {
      0%, 100% { transform: translateY(0) rotate(-1deg); }
      50% { transform: translateY(-14px) rotate(1deg); }
    }

    @keyframes glow {
      from { transform: scale(0.9); opacity: .6; }
      to { transform: scale(1.08); opacity: 1; }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    @keyframes twinkle {
      from { opacity: .35; transform: scale(.7) rotate(0deg); }
      to { opacity: 1; transform: scale(1.25) rotate(20deg); }
    }

    @keyframes fall {
      0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
    }

    @keyframes floatBalloon {
      0% { transform: translateY(0) rotate(-4deg); opacity: 0; }
      15% { opacity: 1; }
      100% { transform: translateY(-120vh) rotate(8deg); opacity: 0; }
    }

    @media (max-width: 750px) {
      .birthday-card {
        height: auto;
      }

      .inside {
        position: relative;
        grid-template-columns: 1fr;
      }

      .front-cover {
        display: none;
      }

      .left-page {
        border-right: none;
        border-bottom: 2px dashed #f7a8c5;
      }

      h1 {
        font-size: 2.1rem;
      }

      .message {
        font-size: 1rem;
      }
    }
  </style>
</head>

<body>
<script>
window.addEventListener("DOMContentLoaded", () => {
  // Change the name here only, and it updates the whole card
  const birthdayName = "Smera";
  document.querySelectorAll(".person-name").forEach(nameSpot => {
    nameSpot.textContent = birthdayName;
  });

  document.title = "Happy Birthday " + birthdayName + "!";

  const card = document.getElementById("birthdayCard");
  const scene = document.getElementById("scene");

  let isOpen = false;

  scene.addEventListener("click", (event) => {
    if (event.target.closest("a")) return;

    isOpen = !isOpen;

    if(isOpen){
      card.classList.add("open");
    } else {
      card.classList.remove("open");
    }
  });
});
</script>
  <div class="confetti">
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
  </div>

  <div class="balloon b1"></div>
  <div class="balloon b2"></div>
  <div class="balloon b3"></div>
  <div class="balloon b4"></div>

  <div class="scene" id="scene">
    <div class="birthday-card" id="birthdayCard">
      <div class="inside">
        <section class="left-page">
          <div class="stars">
            <span>✨</span><span>🌟</span><span>💫</span><span>✨</span>
          </div>

          <h1>Happy Birthday<br><span class="person-name">Jessica</span>!</h1>

          <div class="cake-wrap">
            <div class="cake-glow"></div>
            <img src="cake.png" alt="Birthday Cake">
          </div>
        </section>

        <section class="right-page">
          <p class="message-title">A little birthday wish</p>

          <div class="message">
            <span class="person-name">Jessica</span>, I hope your birthday feels as special as you are.
            May your day be full of smiles, laughter, cake, and memories
            that make you happy every time you think about them.
          </div>


        </section>
      </div>

      <div class="front-cover">
        <div class="cover-content">
          <div class="seal">🎁</div>
          <p>Click to read message</p>
        </div>
      </div>
    </div>
  </div>
  <a href="https://mahajanatharv2009-design.github.io/Resume_AtharvMahajan/"
     class="atharv-btn"
     target="_blank">
     See More of Atharv’s Work →
  </a>

</body>
</html>
